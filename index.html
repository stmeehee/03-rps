<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer></script>
</head>

<body>
    <div class="game-window">
        <div class="game-top">
            <div class="header">
                <div class="left-box"></div>
                <p>Rock Paper Scissor</p>
                <div class="right-box">
                    <button class="reset hidden">reset</button>
                </div>
            </div>
            <div class="scores">
                <div class="player-score">
                    <label>Player Score: </label><span>0</span>
                </div>
                <div>
                    <label>ties: </label><span class="ties-score">0</span>
                </div>                  
                <div class="cpu-score">
                    <label>Computer Score: </label><span>0</span>
                </div>  
            </div>
        </div>
        <div class="game-center">
            <p class="status">Want to Play?</p>
            <div class="hands">
                <img class="player-hand-img" src="" alt="you">
                <span class="vs">VS</span>
                <img class="cpu-hand-img" src="" alt="your enemy">
            </div>
        </div>
        <div class="game-bottom">
            <p class="input-msg">Round <Span class="round">1</Span>: Choose your next move</p>
            <div class="button-container">
                <button>Rock</button>
                <button>Paper</button>
                <button>Scissor</button>
            </div>
        </div>
    </div>
</body>
</html>
